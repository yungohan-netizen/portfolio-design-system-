<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halo Studio — A studio for cinematic dark-mode interfaces.</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="portfolio.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap">
  <style>
    /* Halo Site — display-font override.
       Swap Cas Calisaya for Kanit at the site level only; the global
       tokens in colors_and_type.css stay untouched so the dashboard
       and other surfaces are unaffected. */
    :root {
      --font-display: 'Kanit', 'Geist', 'Inter', system-ui, sans-serif;
      --font-decor:   'Kanit', 'Geist', sans-serif;
    }
    /* Re-tune for Kanit's metrics (wider, less stylized than Cas Calisaya). */
    .hero-title,
    .section-h2,
    .p-hero-title,
    .work-title,
    .p-footer-mega,
    .stat-n,
    .phi-t,
    .cap-card h3,
    .feature-card h3,
    .process-card h3 {
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    .halo-logo-name,
    .ps-greet,
    .footer-logo,
    .contact-loc-v,
    .price-amount .amt,
    .logos-row .brand,
    .p-marquee-row,
    .award-t {
      font-weight: 500;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Features.jsx"></script>
  <script type="text/babel" src="Sections.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
  <script src="animations.js"></script>
</body>
</html>
